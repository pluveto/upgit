# Written by `upgit init`. Fill secrets; do not hand-write recipes.
# HTTP hosts: uncomment a table named after a file in recipes/ (smms, imgur, …).
# Qiniu is built-in (AK/SK, not a web upload token).

default = "qiniu"
naming = "{year}/{month}/{stem}_{unix}{ext}"

[uploaders.qiniu]
access_key = "YOUR_ACCESS_KEY"
secret_key = "YOUR_SECRET_KEY"
bucket = "YOUR_BUCKET"
public_base = "https://cdn.example.com/"
