# Full uploader catalog (git repo only; not packed in the release zip).
# GitHub is the default. Copy one table into config.toml and set `default` to its name.
# Packed/init config is GitHub-only: config.github.toml in the upgit repository.
# HTTP hosts: a table named after a file in recipes/ needs no `type = "http"`.
# Built-in types (github, gitlab, s3, aliyunoss, qcloudcos, upyun, qiniu) use their real fields.
# `default_uploader` is an alias of `default`. `rename` is an alias of `naming`.
# `prefix` is an alias of Qiniu `public_base`. `replacements` is an alias of `link`.

# Which uploader table to use (must match a [uploaders.*] table below).
default = "github"

# Remote object key template. Placeholders: {year} {month} {day} {hour} {minute} {second} {unix} {unix_tsms} {stem} {fname} {fullname} {ext} {hmac} {fname_hash} {fname_hash4} {fname_hash8} {content_hash} {content_hash4} {content_hash8}.
naming = "{year}/{month}/upgit_{year}{month}{day}_{unix}_{hmac}{ext}"

# Secret used to compute {hmac} (HMAC-SHA256). Required only if naming contains {hmac}.
hmac_key = "YOUR_HMAC_KEY"
# Template whose interpolation is hashed to produce {hmac}. Same placeholders as naming except {hmac}.
hmac_format = "{year}_{month}_{day}_{unix}{ext}"
# Truncate the hex digest to this many characters. Omit for the full 64-char hash.
hmac_len = 31

# Optional URL rewrites after upload (substring replace). Useful if GitHub raw is slow:
# [link]
# "raw.githubusercontent.com" = "cdn.jsdelivr.net/gh"
# "/master" = "@master"

# Github. Repo must be public or raw URLs 404.
[uploaders.github]
# Personal access token with "repo" scope (classic) or Contents Read and Write (fine-grained). Create: https://github.com/settings/tokens
pat = "PASTE_YOUR_TOKEN"
# GitHub username that owns the repo.
username = "username"
# Public repository name. Private repos make raw URLs 404.
repo = "repo-name"
# Branch to commit into. Must match the repository default branch.
branch = "main"

# GitLab (self-hosted or gitlab.com). Private projects make raw URLs 404 unless public_base is set.
[uploaders.gitlab]
# GitLab instance origin (alias: host). No trailing slash; not the /api/v4 URL.
url = "https://gitlab.example.com"
# Project path with namespace (group/name). Encoded on the wire as group%2Fname.
project = "group/name"
# Personal access token with api or write_repository. Sent as PRIVATE-TOKEN.
token = "YOUR_GITLAB_TOKEN"
# Branch to commit into. Defaults to main if omitted.
branch = "main"
# Optional public URL prefix for printed links (CDN, reverse proxy, or a public project raw prefix).
# Private GitLab `/-/raw/` URLs 404 without this.
# public_base = "https://cdn.example.com/"

# SM.MS image host. Token: https://sm.ms/home/apitoken
[uploaders.smms]
# SM.MS API token from the dashboard.
token = "YOUR_SMMS_TOKEN"

# Imgur anonymous upload. Client ID: https://api.imgur.com/oauth2/addclient
[uploaders.imgur]
# Imgur OAuth client ID (Client-ID header). Register an application at the URL above.
client_id = "YOUR_IMGUR_CLIENT_ID"

# Self-hosted Chevereto (v3 /v4 API). Admin → Settings → API.
[uploaders.chevereto]
# Chevereto API key from the site admin.
key = "YOUR_CHEVERETO_KEY"
# Full Chevereto upload API URL (usually https://YOUR_SITE/api/1/upload).
upload_url = "https://chevereto.com/api/1/upload"

# Tencent Cloud COS. Keys: https://console.cloud.tencent.com/cam/capi
[uploaders.qcloudcos]
# COS bucket hostname, e.g. <bucket>.cos.<region>.myqcloud.com.
host = "xxx.cos.ap-chengdu.myqcloud.com"
# CAM SecretId for COS.
secret_id = "YOUR_COS_SECRET_ID"
# CAM SecretKey for COS.
secret_key = "YOUR_COS_SECRET_KEY"

# Qiniu: AK/SK mint a token on every put. Do not paste a web upload token.
# Keys: https://portal.qiniu.com/developer/user/key
[uploaders.qiniu]
# Qiniu AccessKey (AK) from the key management page.
access_key = "YOUR_ACCESS_KEY"
# Qiniu SecretKey (SK) paired with the AccessKey.
secret_key = "YOUR_SECRET_KEY"
# Bucket (space) name that receives objects.
bucket = "YOUR_BUCKET"
# Public URL prefix for uploaded objects (CDN domain; alias: prefix).
public_base = "https://cdn.example.com/"
# Optional storage region: z0 (East CN, default), z1, z2, na0, as0.
# region = "z0"

# Gitee may block public image-bed repos. Prefer SM.MS, S3, OSS, or Qiniu.
[uploaders.gitee]
# Gitee username that owns the repo.
username = "username"
# Repository name on Gitee.
repo = "repo-name"
# Gitee personal access token. Create: https://gitee.com/profile/personal_access_tokens
access_token = "YOUR_GITEE_ACCESS_TOKEN"

# Cloudinary unsigned upload. Console: https://cloudinary.com/console
[uploaders.cloudinary]
# Cloudinary cloud name from the dashboard.
cloud_name = "YOUR_CLOUD_NAME"
# Unsigned upload preset name (Settings → Upload).
upload_preset = "YOUR_UPLOAD_PRESET"

# EasyImage (self-hosted). Token is set in the EasyImage admin.
[uploaders.easyimage]
# EasyImage API endpoint (usually https://YOUR_SITE/api/index.php).
request_url = "https://img.example.com/api/index.php"
# EasyImage API token from the admin panel.
token = "YOUR_EASYIMAGE_TOKEN"

# Lsky Pro v2. Token is a Bearer token from the Lsky API.
[uploaders.lskypro2]
# Lsky Pro v2 site origin, no trailing slash.
host = "https://your-lsky.example"
# Authorization value, including the "Bearer " prefix.
token = "Bearer YOUR_TOKEN"

# Amazon S3 or S3-compatible (MinIO, R2, …). Keys: https://console.aws.amazon.com/iam
[uploaders.s3]
# AWS region of the bucket (e.g. us-west-2).
region = "us-west-2"
# S3 bucket name.
bucket_name = "my-bucket"
# IAM access key ID with s3:PutObject.
access_key = "YOUR_S3_ACCESS_KEY"
# IAM secret access key.
secret_key = "YOUR_S3_SECRET_KEY"
# S3 API endpoint (AWS regional URL or a compatible endpoint).
endpoint = "https://s3.us-west-2.amazonaws.com"
# Public URL template, e.g. {endpoint}/{bucket}/{path} → https://s3.us-west-2.amazonaws.com/my-bucket/2024/a.png
url_format = "{endpoint}/{bucket}/{path}"
# Optional CDN. If set (e.g. https://cdn.example.com), the printed URL is that host plus the object path (https://cdn.example.com/2024/a.png) and url_format is ignored. PUT still uses endpoint.
# host = "https://cdn.example.com"

# Aliyun OSS. Keys: https://ram.console.aliyun.com/manage/ak
[uploaders.aliyunoss]
# OSS API endpoint for the bucket region.
endpoint = "https://oss-cn-shanghai.aliyuncs.com"
# RAM AccessKey ID.
access_key_id = "YOUR_OSS_ACCESS_KEY_ID"
# RAM AccessKey secret.
access_key_secret = "YOUR_OSS_ACCESS_KEY_SECRET"
# OSS bucket name.
bucket_name = "your-bucket-name"
# Public URL prefix for uploaded objects (often a CDN domain).
host = "https://cdn.example.com"

# Upyun (又拍云). Operator credentials: https://console.upyun.com
[uploaders.upyun]
# Public CDN hostname (no scheme), used in the printed URL.
host = "cdn.example.com"
# Upyun service (bucket) name.
bucket_name = "YOUR_UPYUN_BUCKET"
# Operator username (alias: username).
user_name = "YOUR_UPYUN_USER"
# Operator password (alias: password).
pass_word = "YOUR_UPYUN_PASSWORD"

# Catbox.moe. userhash: https://catbox.moe/user/manage.php (anonymous upload if omitted).
[uploaders.catbox]
# Catbox userhash from the account manager. Ties uploads to your account.
userhash = "YOUR_CATBOX_USERHASH"

# Helloimg. Account: https://www.helloimg.com
[uploaders.hello]
# Helloimg login (email or username).
username = "YOUR_HELLO_USERNAME"
# Helloimg account password.
password = "YOUR_HELLO_PASSWORD"

# Niupic. No credentials; public upload endpoint.
[uploaders.niupic]

# ImgURL.org. No credentials; public upload endpoint.
[uploaders.imgurlorg]

# ImgBB. API key: https://api.imgbb.com/
[uploaders.imgbb]
# ImgBB API key from the dashboard.
key = "YOUR_IMGBB_KEY"

# Lsky Pro v1. Token from the Lsky user API settings.
[uploaders.lskypro]
# Lsky Pro v1 site origin, no trailing slash.
host = "https://your-lsky.example"
# Lsky Pro v1 API token.
token = "YOUR_LSKYPRO_TOKEN"

# DALEXNI. API key: https://dalexni.com/settings/api
[uploaders.dalexni]
# DALEXNI API key from account settings.
key = "YOUR_DALEXNI_KEY"

# img.tg. auth_token and timestamp come from a logged-in browser session.
[uploaders.imgtg]
# img.tg session auth_token (from the site's upload form).
auth_token = "YOUR_IMGTG_AUTH_TOKEN"
# img.tg form timestamp that pairs with auth_token.
timestamp = "YOUR_IMGTG_TIMESTAMP"

# Juejin CDN. No credentials; public upload endpoint.
[uploaders.juejin]

# Moetu. No credentials; public upload endpoint.
[uploaders.moetu]

# NetEase You.163. No credentials; public upload endpoint.
[uploaders.netease]

# Sogou Pic. No credentials; public upload endpoint.
[uploaders.sougou]

# upload.cc. No credentials; public upload endpoint.
[uploaders.upload_cc]
