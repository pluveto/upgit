# upgit 0.3 config
# Generate a copy with: upgit init
#
# Switching hosts is this file only. No extensions/ folder, no JSONC, no
# short-lived Qiniu upload token (those expire; use AK/SK).

default = "qiniu"
naming = "{year}/{month}/{stem}_{unix}{ext}"

# Optional CDN rewrite after upload (GitHub raw -> jsDelivr, etc.)
# [link]
# "raw.githubusercontent.com" = "cdn.jsdelivr.net/gh"

[uploaders.qiniu]
# `type` is optional when the table name is qiniu.
access_key = "YOUR_ACCESS_KEY"
secret_key = "YOUR_SECRET_KEY"
bucket = "YOUR_BUCKET"
# Bound domain, with or without trailing slash.
public_base = "https://cdn.example.com/"
# region = "z0"   # z0 huadong, z1 huabei, z2 huanan, na0, as0

# Unsigned HTTP hosts use a built-in recipe (smms, imgur) or a TOML file.
# [uploaders.smms]
# type = "http"
# recipe = "smms"
# token = "YOUR_SMMS_TOKEN"
