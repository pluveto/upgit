# 由 `upgit init` 生成。只填密钥，不要手写配方。
# HTTP 图床：取消注释 recipes/ 里同名的表（smms、imgur…）。
# 七牛是内置的（AK/SK，不要填网页上的短时 token）。

default = "qiniu"
naming = "{year}/{month}/{stem}_{unix}{ext}"

[uploaders.qiniu]
access_key = "你的 AccessKey"
secret_key = "你的 SecretKey"
bucket = "你的空间名"
public_base = "https://cdn.example.com/"
# region = "z0"

# [uploaders.smms]
# token = "你的 SMMS token"

# [uploaders.imgur]
# client_id = "你的 Imgur client id"

# [uploaders.lskypro2]
# host = "https://your-lsky.example"
# token = "Bearer 你的 token"
