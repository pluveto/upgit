name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PKG: upgit

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.asset }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: upgit_linux_amd64.zip
            bin: upgit
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: upgit_linux_arm64.zip
            bin: upgit
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: upgit_win_amd64.zip
            bin: upgit.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: upgit_macos_amd64.zip
            bin: upgit
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: upgit_macos_arm64.zip
            bin: upgit
    steps:
      - uses: actions/checkout@v4

      - name: Install cross linker
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p upgit

      - name: Stage zip (binary + config.toml + recipes)
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
          ASSET: ${{ matrix.asset }}
        shell: python
        run: |
          import os, shutil, zipfile
          from pathlib import Path
          src = Path("target") / os.environ["TARGET"] / "release" / os.environ["BIN"]
          pkg = Path("pkg")
          if pkg.exists():
              shutil.rmtree(pkg)
          (pkg / "recipes").mkdir(parents=True)
          dest_name = "upgit.exe" if src.suffix == ".exe" else "upgit"
          shutil.copy2(src, pkg / dest_name)
          shutil.copy2("config.github.toml", pkg / "config.toml")
          for recipe in Path("recipes").glob("*.toml"):
              shutil.copy2(recipe, pkg / "recipes" / recipe.name)
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          zpath = dist / os.environ["ASSET"]
          names = []
          with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as zf:
              for f in pkg.rglob("*"):
                  if f.is_file():
                      rel = f.relative_to(pkg).as_posix()
                      zf.write(f, rel)
                      names.append(rel)
          names.sort()
          assert "config.toml" in names, names
          assert not any("config.sample" in n for n in names), names
          print("wrote", zpath, "files", names)
          print("ok", zpath, zpath.stat().st_size)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    name: github prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.ref_name }}
          name: upgit ${{ github.ref_type == 'tag' && github.ref_name || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            Rust rewrite. Each zip is `upgit` + `config.toml` (GitHub) + `recipes/`.
            Unzip, fill GitHub `pat`/`username`/`repo` (public repo; PAT: https://github.com/settings/tokens), then `upgit FILE`.
            Other hosts: copy a table from the repo `config.sample.toml` (not packed). Do not hand-write JSONC.

            Breaking vs 0.2: no `:clipboard` (use `--clipboard`), Qiniu uses AK/SK not a static token.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
