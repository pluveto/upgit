name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PKG: upgit

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.asset }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: upgit_linux_amd64.zip
            bin: upgit
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: upgit_linux_arm64.zip
            bin: upgit
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: upgit_win_amd64.zip
            bin: upgit.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: upgit_win_arm64.zip
            bin: upgit.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: upgit_macos_amd64.zip
            bin: upgit
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: upgit_macos_arm64.zip
            bin: upgit
    steps:
      - uses: actions/checkout@v4

      - name: Install cross linker
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p upgit

      - name: Stage zip (binary + config.toml + recipes)
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
          ASSET: ${{ matrix.asset }}
        shell: python
        run: |
          import os, shutil, zipfile
          from pathlib import Path
          src = Path("target") / os.environ["TARGET"] / "release" / os.environ["BIN"]
          pkg = Path("pkg")
          if pkg.exists():
              shutil.rmtree(pkg)
          (pkg / "recipes").mkdir(parents=True)
          dest_name = "upgit.exe" if src.suffix == ".exe" else "upgit"
          shutil.copy2(src, pkg / dest_name)
          shutil.copy2("config.github.toml", pkg / "config.toml")
          for recipe in Path("recipes").glob("*.toml"):
              shutil.copy2(recipe, pkg / "recipes" / recipe.name)
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          zpath = dist / os.environ["ASSET"]
          names = []
          with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as zf:
              for f in pkg.rglob("*"):
                  if f.is_file():
                      rel = f.relative_to(pkg).as_posix()
                      info = zipfile.ZipInfo(rel)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.create_system = 3
                      if Path(rel).name == "upgit":
                          info.external_attr = (0o755 << 16)
                      else:
                          info.external_attr = (0o644 << 16)
                      with open(f, "rb") as fh:
                          zf.writestr(info, fh.read())
                      names.append(rel)
          names.sort()
          assert "config.toml" in names, names
          assert not any("config.sample" in n for n in names), names
          print("wrote", zpath, "files", names)
          print("ok", zpath, zpath.stat().st_size)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    name: github release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: upgit ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Download the zip for your OS, unzip, and put `upgit` on your PATH (`chmod +x upgit` on Linux/macOS if needed).

            Each zip contains the `upgit` binary, a GitHub `config.toml`, and `recipes/`.

            ```
            upgit init
            # edit the printed path: pat / username / repo / branch (usually main)
            upgit FILE
            ```

            The GitHub repository must be public. Classic PAT: `repo` scope. Fine-grained PAT: Contents Read and write on that repo.

            Prefer SM.MS, S3, OSS, COS, or Qiniu? Copy a table from this repo's `config.sample.toml` into your config and set `default`.

            Coming from an older upgit? See docs/upgrade-from-0.2.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
