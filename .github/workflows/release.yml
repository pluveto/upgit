name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PKG: upgit

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.asset }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: upgit_linux_amd64
            bin: upgit
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: upgit_linux_arm64
            bin: upgit
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: upgit_win_amd64.exe
            bin: upgit.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: upgit_macos_amd64
            bin: upgit
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: upgit_macos_arm64
            bin: upgit
    steps:
      - uses: actions/checkout@v4

      - name: Install cross linker
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p upgit

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          cp "$src" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    name: github prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.3.0-alpha.1' }}
          name: upgit ${{ github.ref_type == 'tag' && github.ref_name || 'v0.3.0-alpha.1' }}
          prerelease: true
          generate_release_notes: true
          body: |
            First **0.3 alpha** of the Rust rewrite.

            Breaking vs 0.2: new TOML config, no JSONC extensions, no `:clipboard` placeholder.
            Use `--clipboard` / `--clipboard-files`. Qiniu takes AK/SK (not a static upload token).

            This is a prerelease. Do not use as a drop-in replacement for v0.2 without reading the flags.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
