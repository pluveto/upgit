[package]
name = "upgit-uploaders"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Uploader objects for upgit: Qiniu, HTTP recipes, config install."

[dependencies]
base64 = "0.22"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
toml = { version = "0.8", features = ["preserve_order"] }
upgit-core = { path = "../upgit-core", version = "0.3.0-alpha.2" }
ureq = "2"
