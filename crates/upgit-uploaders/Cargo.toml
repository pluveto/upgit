[package]
name = "upgit-uploaders"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
toml = { version = "0.8", features = ["preserve_order"] }
upgit-core = { path = "../upgit-core" }
ureq = "2"
