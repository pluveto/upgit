[package]
name = "upgit-uploaders"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Uploader objects for upgit: GitHub, GitLab, S3, OSS, COS, Upyun, Qiniu, HTTP recipes."

[dependencies]
base64 = "0.22"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = { version = "0.8", features = ["preserve_order"] }
upgit-core = { path = "../upgit-core" }
ureq = "2"
